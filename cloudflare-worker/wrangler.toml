name = "daibfy-ai-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# v2.7.1: Smart Placement 비활성화
# Smart Placement가 HKG 같은 차단 데이터센터로 worker를 옮겨 Anthropic 403 발생.
# 기본값(사용자 edge에서 실행)으로 두면 KR 사용자는 ICN colo에서 실행됨 → Anthropic 허용.
# OpenAI HKG 차단은 worker.js의 retry 로직으로 보완.
# [placement]
# mode = "smart"

# KV namespace for rate limiting (필수 — v6.0)
#   미설정 시 worker가 503으로 fail-secure (서버 키 무방비 노출 방지)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "aa25ac8adbbe4c739fb287e81a0756d9"

# Secrets는 dashboard 또는 `wrangler secret put` 로 등록
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ALLOWED_ORIGINS   (선택)
#   wrangler secret put GITHUB_DISPATCH_TOKEN   (v6.15.58 — GitHub Actions 빌드 트리거용 PAT)

# ── Cron Trigger (v6.15.58, 2026-06-15) ──
# GitHub schedule cron 누락 보완 — 워커가 직접 GitHub Actions 빌드를 dispatch.
# UTC 기준. "0 9,21 * * *" = KST 18:00 / 06:00 (하루 2회 — 비용 절감, 2026-06-15).
#   09 UTC = KST 18:00, 21 UTC = KST 06:00(익일).
# 핸들러: worker.js 의 scheduled() → triggerGithubBuild().
# ※ GitHub 스케줄 cron은 비활성화(.github/workflows/daily-update.yml) — 중복 빌드 방지.
[triggers]
crons = ["0 9,21 * * *"]

# 빌드 대상 (worker.js 기본값과 동일 — 바꿀 때만 주석 해제)
# [vars]
# GH_REPO = "sorakimsr/ai-legaltech-watch"
# GH_WORKFLOW = "daily-update.yml"
# GH_REF = "main"

# 커스텀 도메인 (선택)
# [routes]
# pattern = "api.daibfy.com/*"
# zone_name = "daibfy.com"
